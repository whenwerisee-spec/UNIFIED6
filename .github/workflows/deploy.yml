name: UNIFIED6 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build, and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run lint

      - name: Build production client and server
        run: npm run build

      - name: Run security and ledger tests
        run: npm test

# Render auto-deploys the configured UNIFIED6 service from main.
# Do not call a hard-coded deploy hook for an unrelated service ID.
