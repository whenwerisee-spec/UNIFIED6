name: Withdrawal Redirect Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  withdrawal-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tangerine Withdrawal Redirect Smoke Test
        env:
          NODE_ENV: production
          SOVEREIGN_ENCRYPTION_KEY: 'abcdefghijklmnopqrstuvwxyzABCDEF012345'
          JWT_SECRET: 'abcdefghijklmnopqrstuvwxyzABCDEF012345'
          SOVEREIGN_ADMIN_EMAILS: 'admin@secure.local'
        run: npm run test:withdrawal:tangerine-redirect
