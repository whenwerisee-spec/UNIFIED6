name: Wise Production Deep Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Suite mode"
        required: true
        default: "deep"
        type: choice
        options:
          - deep
          - fast

permissions:
  contents: read

jobs:
  wise-production-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
      WISE_ALL_ACCESS_KEY: ${{ secrets.WISE_API_TOKEN }}
      WISE_PERSONAL_TOKEN: ${{ secrets.WISE_API_TOKEN }}
      WISE_ACCESS_TOKEN: ${{ secrets.WISE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Wise Secret
        run: |
          if [ -z "${WISE_API_TOKEN}" ]; then
            echo "Missing required repository secret: WISE_API_TOKEN"
            echo "Add it in GitHub -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Run Wise Suite (Fast)
        if: ${{ inputs.mode == 'fast' }}
        run: npm run test:wise-production-suite

      - name: Run Wise Suite (Deep)
        if: ${{ inputs.mode == 'deep' }}
        run: npm run test:wise-production-suite:deep

      - name: Upload Suite Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wise-production-suite-logs
          path: |
            *.log
            wise-*.txt
            WISE_SESSION_FULL.txt
          if-no-files-found: ignore
