<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Shield Shape -->
  <path d="M256,40 L440,100 L440,250 C440,360 360,460 256,480 C152,460 72,360 72,250 L72,100 L256,40 Z" fill="url(#shieldGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Outer Gold Border -->
  <path d="M256,60 L410,115 L410,250 C410,345 340,435 256,455 C172,435 102,345 102,250 L102,115 L256,60 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Central Authority Symbol (Layers) -->
  <rect x="200" y="160" width="112" height="12" rx="6" fill="#fbbf24"/>
  <rect x="180" y="190" width="152" height="12" rx="6" fill="#f59e0b"/>
  <rect x="160" y="220" width="192" height="12" rx="6" fill="#d97706"/>

  <!-- Grounded Truth Diamond -->
  <path d="M256,260 L300,320 L256,380 L212,320 Z" fill="#3b82f6" opacity="0.9">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- PQR Protection Ring -->
  <circle cx="256" cy="320" r="80" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="8,4" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 256 320" to="360 256 320" dur="20s" repeatCount="indefinite" />
  </circle>
</svg>
